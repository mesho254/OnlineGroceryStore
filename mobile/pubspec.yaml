name: kijanimart_mobile
description: "KijaniMart | Fresh Highland Groceries in 20 Mins — Full Storefront, Admin Console & Seller Center Flutter App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  share_plus: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/categories/
