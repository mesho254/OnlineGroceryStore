<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="apple-touch-icon" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <meta name="theme-color" content="#059669"/>
    <meta name="description" content="KijaniMart — Farm-fresh organic groceries, highland greens, ripe fruits, dairy, and prime meats delivered in 20 minutes across Nairobi."/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <title>KijaniMart | Fresh Highland Groceries in 20 Mins</title>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script>
    // Always start at the top on full page reloads instead of jumping down after async data loads
    if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);

    // Automatically unregister any stale Service Worker (sw.js) on localhost:3000
    // to prevent "Failed to execute 'clone' on 'Response'" and 504 module fetch interceptions
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
                registration.unregister();
            }
        }).catch(function () {});
        if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
                for (let name of names) {
                    caches.delete(name);
                }
            }).catch(function () {});
        }
    }
</script>
<script type="module" src="/src/index.js"></script>
</body>
</html>
